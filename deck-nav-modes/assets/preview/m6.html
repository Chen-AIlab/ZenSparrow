<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M6 缩略图总览模式 · 星环 X1</title>
<link rel="stylesheet" href="shared.css"/>
<style>
.thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;flex:1;align-content:start}
.thumb{position:relative;border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);transition:transform .3s cubic-bezier(.2,0,.38,.9),box-shadow .3s;background:var(--grey-1)}
.thumb:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(0,0,0,.14)}
.thumb img{width:100%;display:block}
.thumb .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px)}
.thumb .cap .n{font-size:13px;font-weight:600;color:var(--accent)}
.thumb .cap .t{font-size:15px;font-weight:700}
</style>
</head>
<body>
<a class="back-btn" href="index.html">← 模式总览</a>
<!-- M6 缩略图总览 demo：全部页面一屏平铺，点击缩略图直接进入对应页放映 -->
<main class="page has-back">
  <div class="chrome"><span>M6 · GRID OVERVIEW</span><span>5 PAGES</span></div>
  <div class="kicker" data-anim>M6 · 缩略图总览模式</div>
  <h1 class="big" data-anim="2">全部页面，一屏看清</h1>
  <p class="lead" data-anim="3">点击任一缩略图，直接进入该页的线性放映（←→ 可继续翻页）；放映页左上角可返回本总览。</p>

  <div class="thumb-grid" data-anim="4">
    <a class="thumb" href="m1.html?s=0&from=m6"><img src="images/m6-thumb-0.png" onerror="this.closest(\'.thumb\').style.display=\'none\'" alt="封面"/><span class="cap"><span class="n">01</span><span class="t">封面</span></span></a>
    <a class="thumb" href="m1.html?s=1&from=m6"><img src="images/m6-thumb-1.png" onerror="this.closest(\'.thumb\').style.display=\'none\'" alt="亮点"/><span class="cap"><span class="n">02</span><span class="t">三大产品亮点</span></span></a>
    <a class="thumb" href="m1.html?s=2&from=m6"><img src="images/m6-thumb-2.png" onerror="this.closest(\'.thumb\').style.display=\'none\'" alt="规格"/><span class="cap"><span class="n">03</span><span class="t">技术规格</span></span></a>
    <a class="thumb" href="m1.html?s=3&from=m6"><img src="images/m6-thumb-3.png" onerror="this.closest(\'.thumb\').style.display=\'none\'" alt="发售"/><span class="cap"><span class="n">04</span><span class="t">发售计划</span></span></a>
    <a class="thumb" href="m1.html?s=4&from=m6"><img src="images/m6-thumb-4.png" onerror="this.closest(\'.thumb\').style.display=\'none\'" alt="收尾"/><span class="cap"><span class="n">05</span><span class="t">收尾</span></span></a>
  </div>

  <div class="foot">演示内容均为虚构 · M6 缩略图总览模式</div>
</main>
</body>
</html>
